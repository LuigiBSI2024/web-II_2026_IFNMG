info:
  name: Rota inexistente
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/rota-inexistente"

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000
  scripts:
    - type: tests
      code: |-
        test("Retorna 404 para uma rota não cadastrada", function() {
          expect(res.status).to.equal(404);
          expect(res.body.success).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
