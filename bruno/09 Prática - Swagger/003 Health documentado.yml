info:
  name: "Health documentado"
  type: http
  seq: 3
  tags: [aula-10-pratica]

http:
  method: GET
  url: "{{baseUrl}}/api-docs.json"

runtime:
  scripts:
    - type: tests
      code: |-
        const spec = res.body;
        /** Segue referências internas ("#/components/...") até o objeto documentado. */
        function resolve(node) {
          let current = node;
          while (current?.$ref) current = current.$ref.slice(2).split("/").reduce((value, key) => value?.[key], spec);
          return current;
        }
        const item = {"path": "/health", "method": "get", "tag": "Health", "statuses": [200, 503]};
        const operation = spec.paths?.[item.path]?.[item.method];
        test("Operação documentada com resumo e tag", function () {
          expect(res.status).to.equal(200);
          expect(operation, `${item.method.toUpperCase()} ${item.path} documentado`).to.be.an("object");
          expect(operation.summary).to.be.a("string");
          expect(operation.tags).to.include(item.tag);
        });
        test("Status documentados; erros usam ErrorResponse", function () {
          expect(operation, "operação documentada").to.be.an("object");
          for (const status of item.statuses) {
            const response = resolve(operation.responses?.[status]);
            expect(response, `resposta ${status}`).to.be.an("object");
            expect(response.description).to.be.a("string");
            if (status >= 400 && item.path !== "/health") {
              expect(resolve(response.content?.["application/json"]?.schema), `resposta ${status}`).to.deep.equal(spec.components.schemas.ErrorResponse);
            }
          }
        });

settings:
  encodeUrl: true
